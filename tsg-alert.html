<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TSG Horizon Scanning Alert</title>
<style>
  :root { --ink:#1A2B1A; --muted:#5B6B5B; --brand:#1A3D1A; --accent:#4E8A1F; --line:#DCE4D4; --bg:#EEF2EA; --paper:#FFFFFF; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Arial, Helvetica, sans-serif; padding:32px 16px; }
  .page { max-width:780px; margin:0 auto; background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:48px 56px 64px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .eyebrow { font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--accent); margin:0 0 8px; }
  h1 { font-size:28px; line-height:1.2; color:var(--brand); margin:0 0 6px; }
  .meta { font-size:13px; color:var(--muted); border-bottom:2px solid var(--brand); padding-bottom:16px; margin-bottom:28px; }
  h2 { font-size:16px; color:var(--brand); margin:28px 0 8px; }
  .ph { height:12px; background:#EDF1EA; border-radius:3px; margin:8px 0; }
  .demo { margin-top:36px; font-size:13px; color:var(--muted); background:#FFF4E0; border:1px solid #E8C48A; border-radius:6px; padding:10px 14px; }
  @media (max-width:600px) { .page { padding:28px 20px 40px; } h1 { font-size:22px; } }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">fiin Technical Steering Group</p>
  <h1 id="title">TSG Horizon Scanning Alert</h1>
  <div class="meta" id="meta">Category: —</div>
  <h2>Summary</h2>
  <div class="ph" style="width:96%"></div><div class="ph" style="width:88%"></div><div class="ph" style="width:70%"></div>
  <h2>What has changed</h2>
  <div class="ph" style="width:92%"></div><div class="ph" style="width:80%"></div>
  <h2>Recommended actions for members</h2>
  <div class="ph" style="width:85%"></div><div class="ph" style="width:90%"></div><div class="ph" style="width:60%"></div>
  <div class="demo">Demonstration document. The content of this alert will be added by the TSG.</div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var product = q.get('product') || '', cat = q.get('category') || '';
  if (product) {
    document.getElementById('title').textContent = 'TSG Horizon Scanning Alert – ' + product;
    document.title = 'TSG Horizon Scanning Alert – ' + product;
  }
  document.getElementById('meta').textContent = (cat ? 'Category: ' + cat + ' · ' : '') + 'Issued by the fiin TSG · Demo';
</script>
</body>
</html>
